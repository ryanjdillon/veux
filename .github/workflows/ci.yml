name: ci

# Run `just check`: fmt, clippy, tests, and cargo deny. CI does not install
# Nix; nix.yml checks the flake only when Nix files change.
#
# Third-party actions are pinned by commit SHA: a tag is mutable.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libusb is vendored, but its build links the host libudev.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      # rustup installs the toolchain in rust-toolchain.toml on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-deny

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: just check

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
