name: Feature request
description: Suggest a change to veux.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you suggest
      description: Describe the change. Say what you considered and did not choose.
